version: 1
layout: repo
lastReviewedAt: "2026-10-18"
lastReviewedCommit: "7c857f33bf63c3fbeb984218ae3a4d4ff18676e6"
lastReviewedNote: "Reviewed for #47: automation and generated-candidate paths retain existing ownership, coverage, routing and review obligations; governance changes are review metadata only."

catalog:
  repos:
    - id: tidas-spec
      path: .
      canonicalRepo: tiangong-lca/tidas-spec
      entryDoc: AGENTS.md
      workflowDocs:
        - README.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - LICENSE
          - .gitignore
          - .docpact/**
          - .github/dependabot.yml
          - _docs/reference/dependency-updates.md
          - _docs/reference/governance-maintenance.md
      ownerRepo: tidas-spec
    - id: specification-assets
      paths:
        include:
          - assets/**
          - examples/**
          - conformance/**
          - source-import.yaml
          - reviewed-baseline.json
      ownerRepo: tidas-spec
    - id: spec-docs-and-publication
      paths:
        include:
          - docs/**
          - scripts/**
          - test/**
          - spec-manifest.json
          - release/**
          - package.json
          - pnpm-lock.yaml
          - .npmrc
          - toolchain.json
          - .github/workflows/**
      ownerRepo: tidas-spec

coverage:
  include:
    - AGENTS.md
    - README.md
    - LICENSE
    - .gitignore
    - .docpact/**
    - .github/dependabot.yml
    - _docs/reference/dependency-updates.md
    - _docs/reference/governance-maintenance.md
    - assets/**
    - examples/**
    - conformance/**
    - source-import.yaml
    - reviewed-baseline.json
    - docs/**
    - scripts/**
    - test/**
    - spec-manifest.json
    - release/**
    - package.json
    - pnpm-lock.yaml
    - .npmrc
    - toolchain.json
    - .github/workflows/**

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/specification.md
    - docs/qualification.md
    - docs/provenance.md
    - docs/public-rule-adjudication.md
    - docs/ef-process-methodology.md
    - _docs/reference/dependency-updates.md
    - _docs/reference/governance-maintenance.md

routing:
  intents:
    repo-governance:
      paths:
        - AGENTS.md
        - README.md
        - LICENSE
        - .gitignore
        - .docpact/**
        - _docs/reference/governance-maintenance.md
    dependency-maintenance:
      paths:
        - .github/dependabot.yml
        - _docs/reference/dependency-updates.md
    specification-assets:
      paths:
        - assets/**
        - examples/**
        - conformance/**
        - source-import.yaml
        - reviewed-baseline.json
        - spec-manifest.json
    spec-docs:
      paths:
        - docs/**
    spec-build-and-release:
      paths:
        - scripts/**
        - test/**
        - package.json
        - .npmrc
        - toolchain.json
        - pnpm-lock.yaml
        - spec-manifest.json
        - release/**
        - .github/workflows/**

repo:
  id: tidas-spec

rules:
  - id: tidas-spec-bootstrap-contract
    scope: repo
    repo: tidas-spec
    triggers:
      - path: AGENTS.md
        kind: doc-contract
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Repository policy and machine-readable governance must stay aligned with the stated bootstrap state and validation guide.
  - id: tidas-spec-governance-maintenance-contract
    scope: repo
    repo: tidas-spec
    triggers:
      - path: .docpact/**
        kind: doc-ai-layer
      - path: _docs/reference/governance-maintenance.md
        kind: maintainer-reference
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/reference/governance-maintenance.md
        mode: review_or_update
      - path: AGENTS.md
        mode: must_exist
      - path: README.md
        mode: must_exist
    reason: Configuration navigation and governance review belong in a nonpublished maintenance reference; semantic contract changes retain their existing source-document review rules.
  - id: tidas-spec-readme-contract
    scope: repo
    repo: tidas-spec
    triggers:
      - path: README.md
        kind: repo-landing
      - path: LICENSE
        kind: license
      - path: .gitignore
        kind: repo-config
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: The contributor-facing entrypoint, license notice, and ignore rules must retain the repository contract and governed entrypoint.
  - id: tidas-spec-content-contract
    scope: repo
    repo: tidas-spec
    triggers:
      - path: assets/**
        kind: specification-asset
      - path: examples/**
        kind: specification-example
      - path: conformance/**
        kind: conformance-asset
      - path: source-import.yaml
        kind: source-record
      - path: reviewed-baseline.json
        kind: source-record
      - path: docs/**
        kind: spec-doc
      - path: spec-manifest.json
        kind: release-manifest
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Specification content, examples, conformance material, and the release manifest change the published baseline and its publication state.
  - id: tidas-spec-build-and-release-contract
    scope: repo
    repo: tidas-spec
    triggers:
      - path: scripts/**
        kind: asset-build
      - path: test/**
        kind: asset-build
      - path: package.json
        kind: package-runtime
      - path: pnpm-lock.yaml
        kind: package-runtime
      - path: .npmrc
        kind: package-runtime
      - path: toolchain.json
        kind: package-runtime
      - path: release/**
        kind: release-artifact
      - path: .github/workflows/**
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Build, package identity, and publication automation alter the release contract, integrity guarantees, and validation guide.
  - id: tidas-spec-dependency-monitoring-contract
    scope: repo
    repo: tidas-spec
    triggers:
      - path: .github/dependabot.yml
        kind: dependency-monitoring
      - path: _docs/reference/dependency-updates.md
        kind: maintainer-reference
    requiredDocs:
      - path: _docs/reference/dependency-updates.md
        mode: review_or_update
    reason: Dependency proposal scope and maintenance remain documented separately from the shipped specification and release artifacts.
