version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      development-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
